<!DOCTYPE html>
<html>
<head>
  <title>Callback Confirmation</title>
  <style>
    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f1f5f9;
      font-family: Arial;
    }
    .box {
      background: white;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }
    h2 { color: #2ecc71; }
  </style>
</head>
<body>

<div class="box">
  <h2>Request Received ✔</h2>
  <p>
    We got your request.<br>
    We will call you back within <b>10 minutes</b>.
  </p>
</div>

</body>
</html>
